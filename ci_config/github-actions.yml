name: MatrixTest - UI 自动化 + 性能监控

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # 每天晚上 22:00 定时执行回归测试
    - cron: '0 22 * * *'

env:
  TARGET_PACKAGE: ${{ secrets.TARGET_PACKAGE }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  PERF_SERVER_URL: ${{ secrets.PERF_SERVER_URL }}

jobs:
  # ========== 环境检查 ==========
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -c "import uiautomator2; print('✅ uiautomator2 ready')"

  # ========== AI 生成用例 ==========
  ai_generate:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4

      - name: Generate test cases with AI
        run: |
          python -c "
from ai_generator.generator import generate_batch_cases;
import json;
cases = generate_batch_cases('核心流程', '$TARGET_PACKAGE', 5);
json.dump(cases, open('tests/cases/ai_generated.json', 'w'), ensure_ascii=False, indent=2);
print(f'✅ 生成 {len(cases)} 条用例')
"

      - name: Upload generated cases
        uses: actions/upload-artifact@v4
        with:
          name: ai-test-cases
          path: tests/cases/

  # ========== UI 测试 + 性能监控 ==========
  test_and_perf:
    runs-on: ubuntu-latest
    needs: ai_generate
    strategy:
      matrix:
        device: [emulator-5554]  # 可扩展多台设备
    steps:
      - uses: actions/checkout@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Start Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          script: |
            adb devices
            echo "✅ 模拟器已启动"

      - name: Download AI cases
        uses: actions/download-artifact@v4
        with:
          name: ai-test-cases
          path: tests/cases/

      - name: Run UI Tests + Performance Monitor
        run: |
          python run_tests.py \
            --cases tests/cases/ \
            --device ${{ matrix.device }} \
            --perf \
            --output tests/results/

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.device }}
          path: |
            tests/results/
            tests/screenshots/

  # ========== 报告生成 & 通知 ==========
  report:
    runs-on: ubuntu-latest
    needs: test_and_perf
    steps:
      - uses: actions/checkout@v4

      - name: Download all results
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Generate HTML Report
        run: |
          python reporter/report_generator.py \
            --input artifacts/ \
            --output tests/results/final_report.html

      - name: Upload final report
        uses: actions/upload-artifact@v4
        with:
          name: final-report
          path: tests/results/final_report.html

      # 飞书/钉钉通知（可选）
      - name: Notify Feishu
        if: always()
        run: |
          curl -X POST ${{ secrets.FEISHU_WEBHOOK }} \
            -H 'Content-Type: application/json' \
            -d '{
              "msg_type": "interactive",
              "card": {
                "header": {
                  "title": {"tag": "plain_text", "content": "MatrixTest 测试完成"},
                  "template": "${{ job.status == 'success' && 'green' || 'red' }}"
                }
              }
            }'
