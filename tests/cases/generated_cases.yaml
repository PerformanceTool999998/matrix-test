cases:
- id: TC_ORDER_001
  name: 正常下单流程
  description: 用户选择商品进行支付，输入正确支付密码，下单成功
  priority: P0
  preconditions:
  - 已安装应用
  - 网络正常
  - 用户已登录
  - 商品列表可用
  steps:
  - action: click
    target: 商品列表
    target_type: text
    value: null
    timeout: 5
    description: 点击进入商品列表
  - action: click
    target: 商品名称
    target_type: text
    value: null
    timeout: 5
    description: 选择一个商品
  - action: click
    target: 加入购物车
    target_type: text
    value: null
    timeout: 5
    description: 点击'加入购物车'
  - action: click
    target: 去结算
    target_type: text
    value: null
    timeout: 5
    description: 点击'去结算'
  - action: input
    target: 支付密码输入框
    target_type: resourceId
    value: '123456'
    timeout: 5
    description: 输入正确的支付密码
  - action: click
    target: 确认支付
    target_type: text
    value: null
    timeout: 5
    description: 点击'确认支付'
  expected_result: 支付成功，订单详情显示
  tags:
  - 下单
  - 支付
  - 正常流程
