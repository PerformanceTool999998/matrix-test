name: MatrixTest CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # 每天凌晨 2 点执行
    - cron: '0 2 * * *'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run smoke tests
      env:
        AI_API_KEY: ${{ secrets.AI_API_KEY }}
        TARGET_PACKAGE: ${{ vars.TARGET_PACKAGE }}
        PERF_SERVER_URL: ${{ vars.PERF_SERVER_URL }}
      run: |
        python main.py ci --suite smoke

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: output/

    - name: Upload reports to MatrixPerformance
      if: always()
      run: |
        curl -X POST ${{ vars.PERF_SERVER_URL }}/performance/upload           -H "Content-Type: application/json"           -d @output/result_*.json

  notify:
    needs: test
    if: failure()
    runs-on: ubuntu-latest

    steps:
    - name: Notify DingTalk
      uses: actions/github-script@v7
      with:
        script: |
          const webhook = process.env.DINGTALK_WEBHOOK;
          if (webhook) {
            await fetch(webhook, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                msgtype: 'text',
                text: { content: '❌ MatrixTest 测试失败，请检查: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}' }
              })
            });
          }
